# Blueprint oficial do Render — somente a API do PixTune.
# O frontend é publicado separadamente no Cloudflare Pages.
#
# Referência: https://render.com/docs/blueprint-spec
#
# Segredos usam "sync: false": o Render pede o valor na criação do Blueprint e
# preserva o valor existente nas sincronizações seguintes. Nenhum segredo real
# fica versionado neste arquivo.
services:
  - type: web
    name: pixtune-app
    runtime: node
    plan: free # ajuste para o plano desejado (free sofre spin-down por inatividade)
    # migrate deploy aplica as migrations versionadas antes do build. Se o
    # banco estiver sem schema, o deploy falha em vez de subir uma API quebrada.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Origem da API, SEM o sufixo /api (o código já adiciona /api nas rotas).
      - key: API_URL
        value: https://pixtune-app.onrender.com

      # Origem do frontend no Cloudflare Pages.
      - key: APP_URL
        value: https://pixtune-app.pages.dev

      # Inclua aqui o domínio de produção do Cloudflare Pages (e custom domains).
      - key: CORS_ORIGINS
        value: https://pixtune-app.pages.dev

      # URIs exatas cadastradas no Spotify Developer Dashboard.
      # Apontam para o proxy same-origin do Cloudflare Pages para que o cookie
      # de sessão seja first-party em Brave/Safari/Firefox (ver functions/api).
      - key: SPOTIFY_REDIRECT_URI
        value: https://pixtune-app.pages.dev/api/auth/spotify/callback
      - key: SPOTIFY_CONNECT_REDIRECT_URI
        value: https://pixtune-app.pages.dev/api/spotify/callback

      # Segredos: preencha no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
