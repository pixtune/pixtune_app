# Blueprint oficial do Render — Aplicação Unificada PixTune (Next.js 14 App Router + Hono API).
#
# Referência: https://render.com/docs/blueprint-spec
#
# Segredos usam "sync: false": o Render pede o valor na criação do Blueprint e
# preserva o valor existente nas sincronizações seguintes. Nenhum segredo real
# fica versionado neste arquivo.
services:
  - type: web
    name: pixtune-app
    runtime: node
    plan: free # ajuste para o plano desejado (free sofre spin-down por inatividade)
    # migrate deploy aplica as migrations versionadas antes do build.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Origem unificada da aplicação PixTune.
      - key: APP_URL
        value: https://pixtune-app.onrender.com

      - key: API_URL
        value: https://pixtune-app.onrender.com

      # URIs exatas cadastradas no Spotify Developer Dashboard.
      - key: SPOTIFY_REDIRECT_URI
        value: https://pixtune-app.onrender.com/api/auth/spotify/callback
      - key: SPOTIFY_CONNECT_REDIRECT_URI
        value: https://pixtune-app.onrender.com/api/spotify/callback

      # Segredos: preencha no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
